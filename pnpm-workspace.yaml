# Build scripts are blocked by default in pnpm 11. Each entry below is an
# explicit decision to let that package run its install script.
allowBuilds:
  # Downloads the Prisma query engine binaries — required for any DB access.
  '@prisma/engines': true
  prisma: true
  # Platform-native binary used by vitest/tsx transpilation.
  esbuild: true
  # Native resolver binding used by the ESLint import resolver.
  unrs-resolver: true
  # Optional native msgpack accelerator (Next.js cache). Safe to build.
  msgpackr-extract: true

# Versions newer than the default minimum-release-age gate that we have
# deliberately pinned in package.json.
minimumReleaseAgeExclude:
  - lucide-react@1.31.0
  - tsx@4.23.12

# Forced transitive versions, each closing a specific advisory.
# pnpm 11 reads overrides here, not from package.json.
overrides:
  # GHSA-38f7-945m-qr2g (high): AsyncLocalStorage context lost or contaminated
  # inside Effect fibers under concurrent load. UploadThing carries per-request
  # user identity through this machinery, so contamination is not an abstract
  # risk here. Patched in 3.20.0, which prisma already resolves.
  effect: '>=3.20.0'
  # GHSA-w5hq-g745-h8pq (moderate): missing buffer bounds check in uuid v3/v5/v6
  # when a buffer is supplied. Reached only through exceljs.
  uuid: '>=11.1.1'
